name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - name: Install desktop test dependencies
        run: |
          npx playwright install-deps chromium
          sudo apt-get install -y openbox xvfb xauth fonts-noto-cjk
          sudo chown root:root node_modules/electron/dist/chrome-sandbox
          sudo chmod 4755 node_modules/electron/dist/chrome-sandbox
      - run: npm run typecheck
      - run: npm run test:unit
      - run: npm run test:python
      - run: npm run build
      - run: xvfb-run -a npm run test:runtime
      - name: Electron desktop and visual regression
        run: xvfb-run -a -s '-screen 0 1920x1080x24' sh -c 'openbox & npm run test:desktop'
      - run: npm run package:dir
      - name: Configure Chromium sandbox for the unpacked package
        run: |
          cmp node_modules/electron/dist/chrome-sandbox release/linux-unpacked/chrome-sandbox
          sudo chown root:root release/linux-unpacked/chrome-sandbox
          sudo chmod 4755 release/linux-unpacked/chrome-sandbox
      - run: xvfb-run -a npm run test:packaged

  package-smoke:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run test:runtime
      - run: npm run package:dir
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - run: npm run test:packaged
