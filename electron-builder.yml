appId: local.training-monitor.desktop
directories:
  output: release
files:
  - dist/**/*
  - package.json
asar: true
win:
  icon: assets/icons/icon.ico
  target:
    - target: nsis
      arch: [x64]
    - target: zip
      arch: [x64]
mac:
  icon: assets/icons/icon.icns
  category: public.app-category.developer-tools
  target:
    - target: dmg
      arch: [arm64, x64]
    - target: zip
      arch: [arm64, x64]
linux:
  icon: assets/icons/icon.png
  category: Development
  target:
    - target: AppImage
      arch: [x64]
    - target: deb
      arch: [x64]
appImage:
  executableArgs: []
